[versions]
java = "21"
kotlin = "2.4.20"
spring-boot = "4.1.1"
# Ueber Spring Boots Stand hinaus angehoben, bis ein Boot-Patch sie mitbringt: Tomcat und Jackson
# tragen in Boots Versionen bekannte Sicherheitsmeldungen (OSV; die CI prueft per OSV-Scanner).
# Beim naechsten Boot-Patch pruefen und entfernen, was Boot selbst erreicht.
tomcat = "11.0.26"
jackson3 = "3.1.7"
jackson2-boot = "2.21.7"
spring-modulith = "2.1.1"
dependency-management = "1.1.7"
springdoc-openapi = "3.1.1"
kotest = "6.2.5"
# Nur Tests: TextCatalog liest die Nutzertexte aus den kompilierten Klassen.
asm = "9.9.1"
# Architekturregeln der Keycloak-Erweiterung; dieselbe Fassung, die Spring Modulith dem Hauptprojekt mitbringt.
archunit = "1.4.2"
mockk = "1.14.11"
springmockk = "5.0.1"
kover = "0.9.9"
openapi-generator = "7.25.0"
openapi-diff = "2.1.7"
# Eine Version fuer beide Seiten der Peer-Auth-Signatur: keycloak-extension signiert, der
# Orchestrator (PeerAuthValidator) prueft - derselbe JOSE-Dialekt, nicht nur dieselbe Bibliothek.
nimbus-jose-jwt = "10.10"
# Jackson 2 nur fuer keycloak-extension (der Orchestrator laeuft auf Jackson 3 / tools.jackson).
jackson2 = "2.21.7"
shadow = "9.2.2"
# SBOM fuer die Pruefung der Abhaengigkeiten gegen OSV in der CI.
cyclonedx = "3.4.1"
# Argon2id fuer Passwoerter (Spring Securitys Argon2PasswordEncoder braucht die Implementierung).
bouncycastle = "1.85.2"
# Keycloak-Server, gegen den keycloak-extension baut. Die Image-Tags in compose.yml,
# keycloak-extension/Dockerfile und openshift/local-up.sh muessen dazu passen. Die Version folgt dem Strom des Red Hat
# build of Keycloak (docs/13-ausfuehren.md Abschnitt 5), nicht dem neuesten Upstream-Release.
keycloak = "26.6.4"
# keycloak-admin-client wird unabhaengig vom Server released; 26.0.12 ist die letzte Version auf
# Maven Central. Das REST-API ist innerhalb von Keycloak 26.x stabil.
keycloak-admin-client = "26.0.12"
# Folgt der Keycloak-Version: resteasy.version in keycloak-parent.
resteasy = "6.2.16.Final"
jakarta-ws-rs = "3.1.0"
zxing = "3.5.3"
jsr305 = "3.0.2"
junit = "6.0.3"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-jdbc = { module = "org.springframework.modulith:spring-modulith-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
h2 = { module = "com.h2database:h2" }
spring-boot-h2console = { module = "org.springframework.boot:spring-boot-h2console" }
flyway-core = { module = "org.flywaydb:flyway-core" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson2-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson2" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
kotlin-script-runtime = { module = "org.jetbrains.kotlin:kotlin-script-runtime", version.ref = "kotlin" }
# Jackson 3 Kotlin module: JourneyState is persisted as JSON (data classes + sealed hierarchies).
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
# Jackson 2 Kotlin module for swagger-core (springdoc), which still runs on Jackson 2: without it the
# spec shows mangled property names for value classes. Version from the Spring Boot BOM.
jackson2-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }
openapi-diff-cli = { module = "org.openapitools.openapidiff:openapi-diff-cli", version.ref = "openapi-diff" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
keycloak-server-spi = { module = "org.keycloak:keycloak-server-spi", version.ref = "keycloak" }
keycloak-server-spi-private = { module = "org.keycloak:keycloak-server-spi-private", version.ref = "keycloak" }
keycloak-services = { module = "org.keycloak:keycloak-services", version.ref = "keycloak" }
keycloak-model-storage = { module = "org.keycloak:keycloak-model-storage", version.ref = "keycloak" }
keycloak-model-storage-private = { module = "org.keycloak:keycloak-model-storage-private", version.ref = "keycloak" }
keycloak-common = { module = "org.keycloak:keycloak-common", version.ref = "keycloak" }
keycloak-core = { module = "org.keycloak:keycloak-core", version.ref = "keycloak" }
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloak-admin-client" }
resteasy-core = { module = "org.jboss.resteasy:resteasy-core", version.ref = "resteasy" }
jakarta-ws-rs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakarta-ws-rs" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }