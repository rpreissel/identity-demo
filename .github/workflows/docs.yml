name: Doku-Website

# Baut docs/ mit VitePress (site/) und veroeffentlicht es auf GitHub Pages. Ein Pull Request baut
# nur - der Build bricht bei toten Links und unverlinkten Dateien ab (docs/13-ausfuehren.md
# Abschnitt 9). Einmalig noetig: Settings -> Pages -> Source "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Website bauen
    runs-on: ubuntu-latest
    steps:
      # lfs: das Video liegt in Git LFS; ohne lfs wuerde nur die Zeiger-Datei veroeffentlicht.
      # fetch-depth 0: "Zuletzt geaendert" je Seite kommt aus der Git-Historie.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Bauen
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/.vitepress/dist

  deploy:
    name: Veroeffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
