name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen: Der Build braucht keine Schreibrechte am Repository.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # gradle-wrapper.jar liegt als Binaerdatei im Repo (ohne sie scheitert jeder frische
      # Checkout). Diese Pruefung vergleicht sie gegen die Pruefsummen echter Gradle-Releases -
      # eine untergeschobene Wrapper-Jar wuerde sonst unbemerkt im Build ausgefuehrt.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Deckt Backend und Frontend ab: `build` zieht ueber processResources -> npmBuild den
      # Vite-Build mit, und ueber assemble -> stagePodmanArtifacts das Entpacken der Boot-Jar in
      # den flachen Container-Classpath (build.gradle.kts). Ein Fehler beim Staging faellt damit
      # hier auf und nicht erst beim `podman-compose build`.
      - name: Backend-Tests und Artefakt-Staging
        run: ./gradlew build

      - name: Frontend-Tests
        working-directory: frontend
        run: npm test

      # vitest transpiliert nur und prueft keine Typen. Ohne diesen Schritt geht ein Typfehler im
      # Frontend durch die CI. `--force`, weil tsc sonst gegen ein aus dem npm-Cache
      # mitgebrachtes .tsbuildinfo laeuft und den Build als aktuell ansieht.
      - name: Frontend-Typpruefung
        working-directory: frontend
        run: npx tsc -b --force

      - name: Frontend-Lint
        working-directory: frontend
        run: npm run lint

      # Bekannte Luecken in dem, was tatsaechlich ausgeliefert wird. Nur Laufzeit-Abhaengigkeiten
      # (--omit=dev): eine Warnung in einem Build-Werkzeug erreicht keinen Nutzer, und sie hier
      # durchschlagen zu lassen, wuerde die CI an Dingen rot machen, die niemand ausliefert. Ab
      # "high", damit der Schritt ein Signal bleibt und kein Dauerrauschen wird.
      - name: Frontend-Abhaengigkeiten ohne bekannte Luecken
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      # Dasselbe fuer das Backend und die Keycloak-Erweiterung: ein SBOM je ausgeliefertem Artefakt
      # (nur runtimeClasspath, build.gradle.kts), geprueft gegen OSV. Das Binary ist ueber seine
      # Pruefsumme festgelegt. Keycloak selbst steckt nicht darin; seine Version steht im
      # Versionskatalog und in den Image-Tags.
      - name: Backend-Abhaengigkeiten ohne bekannte Luecken
        env:
          OSV_VERSION: v2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          ./gradlew cyclonedxDirectBom :keycloak-extension:cyclonedxDirectBom
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source -L build/reports/cyclonedx-direct/bom.json -L keycloak-extension/build/reports/cyclonedx-direct/bom.json

      # api/openapi.yaml und api/modules/*.yaml sind die einzige geschriebene Fassung des
      # API-Vertrags (docs/05-api.md). Weicht sie vom Code ab, soll das hier auffallen und nicht
      # erst zur Laufzeit in einem der drei Clients, die den Vertrag lesen.
      - name: OpenAPI-Snapshot aktuell
        run: ./gradlew checkOpenApiSnapshot

      # Und der Vertrag darf die bereits veroeffentlichte Version nicht brechen. Reihenfolge ist
      # wichtig: erst muss der Snapshot zum Code passen, dann werden seine Teile (Umschlag, je Tool
      # eine Datei, ADR-50) gegen api/published/ gehalten. Der Snapshot-Test macht jede Aenderung sichtbar, diese Pruefung sagt, ob sie
      # brechend ist.
      - name: Veroeffentlichte API-Version nicht gebrochen
        run: ./gradlew checkPublishedApiCompatibility

      # Die erzeugten Frontend-Typen muessen zum Vertrag passen. Sonst koennte ein veralteter,
      # eingecheckter Generatorstand die Typpruefung oben gruen halten.
      - name: Generierte Frontend-Typen aktuell
        run: |
          ./gradlew generateFrontendApiTypes
          git diff --exit-code -- frontend/src/generated \
            || { echo "::error::frontend/src/generated ist veraltet. Bitte './gradlew generateFrontendApiTypes' laufen lassen und das Ergebnis committen."; exit 1; }

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Frontend-Abhaengigkeiten
        working-directory: frontend
        run: npm ci

      - name: Playwright-Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Die Suite startet ihren eigenen Server auf Port 8091 mit frischer In-Memory-DB
      # (playwright.config.ts). Ein laufender Dienst wird also nicht vorausgesetzt, aber der
      # Vite-Build muss in src/main/resources/static liegen, bevor bootRun ihn ausliefert.
      - name: Frontend bauen
        run: ./gradlew npmBuild

      - name: E2E-Tests
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7
