spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

dpop:
  proof:
    max-clock-skew-seconds: 30
    max-age-seconds: 60

# Geplante Jobs laufen in Tests nicht von selbst (SchedulingConfig); ein Test ruft den Job direkt auf.
scheduling:
  enabled: false

# Ein Web-Kanal im Test nennt diese Keycloak-Adresse als Rücksprung für ident-nect.
ident-nect:
  return-uri-prefixes:
    - https://kc.test/realms/
