was-keycloak-auf-seinen-anmeldeseiten-4795e7=What Keycloak asks for on its sign-in pages is decided in the background by the same orchestrator as in the app: same accounts, same methods, same security levels. If the app is already signed in, you can confirm the sign-in there with a QR code. Only the website itself is simulated: it is this page.
