components:
  schemas:
    ChannelResponse:
      properties:
        stepData:
          $ref: '#/components/schemas/StepData'
          description: Whatever the current step needs to render. `kind` names the shape - see StepData.
      type: object
    EnrollSmsStep:
      description: Waiting for the phone number or its TAN; `replaces` says the account already has a number.
      properties:
        kind:
          enum:
          - enroll-sms
          type: string
        missingFields:
          example:
          - phoneNumber
          items:
            type: string
          type: array
        replaces:
          example: false
          type: boolean
      required:
      - kind
      - missingFields
      - replaces
    EnrollSmsV2PatchRequest:
      properties:
        consent:
          description: Consent to storing the number and sending codes to it. Required with the phone number; without it no
            code is sent and missingFields names it.
          example: true
          type: boolean
        phoneNumber:
          example: +49 170 1234567
          type: string
        tan:
          example: '123456'
          type: string
      type: object
    ErrorResponse:
      type: object
    StepData:
      description: What the current step needs to render. `kind` names the shape; see the mapping on this schema for the ones
        this deployment can produce.
      discriminator:
        mapping:
          enroll-sms: '#/components/schemas/EnrollSmsStep'
        propertyName: kind
      oneOf:
      - $ref: '#/components/schemas/EnrollSmsStep'
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing Keycloak facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /tools/api/enroll-sms/v2:
    post:
      description: 'No request body: toolId already carries kind and method. The first step asks for the number and the consent.'
      operationId: activate_4
      parameters:
      - in: query
        name: channel
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  step: enroll
                  toolId: enroll-sms
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
                stepData:
                  kind: enroll-sms
                  missingFields:
                  - phoneNumber
                  - consent
                  replaces: false
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Activate enroll-sms (version 2)
      tags:
      - 'Tool: SMS'
  /tools/api/enroll-sms/v2/{toolSessionId}:
    get:
      operationId: read_4
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  step: tanInput
                  toolId: enroll-sms
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Read the current enroll-sms state (version 2)
      tags:
      - 'Tool: SMS'
    patch:
      description: First call with phoneNumber and consent=true triggers the TAN send; without consent nothing is sent and
        missingFields names it. A second call with tan confirms the number.
      operationId: patch_4
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollSmsV2PatchRequest'
      responses:
        '200':
          content:
            application/json:
              examples:
                After phoneNumber and consent - TAN sent:
                  description: After phoneNumber and consent - TAN sent
                  value:
                    channel:
                      channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      state: REGISTERING
                    demo:
                      tan: '123456'
                    next:
                      step: tanInput
                      toolId: enroll-sms
                      toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                      type: tool
                phoneNumber without consent - nothing sent:
                  description: phoneNumber without consent - nothing sent
                  value:
                    channel:
                      channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      state: REGISTERING
                    next:
                      step: enroll
                      toolId: enroll-sms
                      toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                      type: tool
                    stepData:
                      kind: enroll-sms
                      missingFields:
                      - phoneNumber
                      - consent
                      replaces: false
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Supply phone number with consent, then TAN
      tags:
      - 'Tool: SMS'
tags:
- description: 'SMS-TAN: Einrichtung als Faktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: SMS'
