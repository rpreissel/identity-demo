components:
  schemas:
    SentSms:
      properties:
        phoneNumber:
          type: string
        sentAt:
          format: date-time
          type: string
        sequence:
          format: int64
          type: integer
        tan:
          type: string
      required:
      - phoneNumber
      - sentAt
      - sequence
      - tan
      type: object
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
    kc-peer-auth:
      bearerFormat: JWT
      description: 'Signed peer-auth assertion (docs/05-api.md Abschnitt 3, ADR-7). The Web channel''s proof: Keycloak calls
        server-to-server, and the channel binding comes out of the assertion.'
      scheme: bearer
      type: http
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing kc facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /mock-sms/outbox:
    get:
      description: Die zuletzt verschickten SMS, neueste zuerst.
      operationId: outbox
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/SentSms'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Postausgang
      tags:
      - Mock SMS
tags:
- description: 'SMS-TAN: Einrichtung als Faktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: SMS'
- description: Simulierter SMS-Anbieter - kein Endpunkt dieser Anwendung, sondern der Fremddienst
  name: Mock SMS
- description: Gerätebindung über den externen Dienstleister KOBIL
  name: 'Tool: KOBIL'
- description: 'Geraetebindung: Einrichtung und Anmeldung ueber den Geraeteschluessel'
  name: 'Tool: Gerät'
- description: 'Passwort: Einrichtung als Wissensfaktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: Passwort'
- description: 'E-Mail: Bestaetigung der Adresse, Anmeldung und Login ohne DPoP'
  name: 'Tool: E-Mail'
- description: 'QR-Pairing: Freigabe eines Web-Kanals aus einer bereits angemeldeten App'
  name: 'Tool: QR-Login'
