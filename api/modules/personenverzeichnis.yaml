components:
  schemas:
    BriefView:
      properties:
        art:
          enum:
          - FREISCHALTCODE
          - EINMALKENNWORT
          type: string
        code:
          type: string
        einladungId:
          type: string
        freischaltcodeId:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        personId:
          type: string
        versandtAm:
          format: date-time
          type: string
        vorgang:
          type: string
      required:
      - art
      - code
      - id
      - personId
      - versandtAm
      type: object
    EinladungAusstellenRequest:
      properties:
        gueltigBis:
          format: date-time
          type: string
        niveau:
          type: string
        vorgang:
          type: string
      required:
      - gueltigBis
      - niveau
      - vorgang
      type: object
    EinladungView:
      properties:
        abgeschlossenAm:
          format: date-time
          type: string
        ausgestelltAm:
          format: date-time
          type: string
        gueltigBis:
          format: date-time
          type: string
        id:
          type: string
        niveau:
          type: string
        offen:
          type: boolean
        personId:
          type: string
        vorgang:
          type: string
        widerrufenAm:
          format: date-time
          type: string
      required:
      - ausgestelltAm
      - gueltigBis
      - id
      - niveau
      - offen
      - personId
      - vorgang
      type: object
    FreischaltcodeAusstellenRequest:
      properties:
        gueltigBis:
          format: date-time
          type: string
      required:
      - gueltigBis
      type: object
    FreischaltcodeView:
      properties:
        expiresAt:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        personId:
          type: string
        revokedAt:
          format: date-time
          type: string
        valid:
          type: boolean
      required:
      - expiresAt
      - id
      - personId
      - valid
      type: object
    PersonData:
      properties:
        email:
          type: string
        geburtsdatum:
          format: date
          type: string
        hausnummer:
          type: string
        id:
          type: string
        kvnr:
          type: string
        mobilnummer:
          type: string
        name:
          type: string
        ort:
          type: string
        plz:
          type: string
        strasse:
          type: string
        versnr:
          type: string
        vorname:
          type: string
      type: object
    Vorgang:
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      type: object
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
    kc-peer-auth:
      bearerFormat: JWT
      description: 'Signed peer-auth assertion (docs/05-api.md Abschnitt 3, ADR-7). The Web channel''s proof: Keycloak calls
        server-to-server, and the channel binding comes out of the assertion.'
      scheme: bearer
      type: http
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing Keycloak facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /mock-personenverzeichnis/briefe:
    get:
      description: Alle verschickten Briefe, neueste zuerst.
      operationId: briefe
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/BriefView'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Briefkasten
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/einladungen/{einladungId}:
    delete:
      operationId: einladungWiderrufen
      parameters:
      - in: path
        name: einladungId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Einladung widerrufen
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/einladungen/{einladungId}/abschluss:
    post:
      description: Das Fachsystem meldet den Vorgang als erledigt, mit der Id der Einladung (dem Hash). Die Einladung endet
        und mit ihr ihre Sitzungen.
      operationId: einladungAbschliessen
      parameters:
      - in: path
        name: einladungId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EinladungView'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Vorgang abschließen
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/freischaltcodes/{freischaltcodeId}:
    delete:
      operationId: widerrufen
      parameters:
      - in: path
        name: freischaltcodeId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Freischaltcode widerrufen
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/personen:
    get:
      operationId: personen
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/PersonData'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Alle Personen im Register
      tags:
      - Mock Personenverzeichnis
    post:
      description: Das Verzeichnis vergibt die Partnernummer. Versicherungsnummer (acht Ziffern) und KVNR (ein Buchstabe,
        neun Ziffern) sind optional und eindeutig; eine KVNR nur zusammen mit einer Versicherungsnummer.
      operationId: anlegen
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonData'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonData'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Person anlegen
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/personen/{personId}:
    put:
      description: Alles außer der Partnernummer; Regeln wie beim Anlegen. Änderungen gehen als Ereignis an die Konten (ADR-34).
      operationId: aendern
      parameters:
      - in: path
        name: personId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonData'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonData'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Person ändern
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/personen/{personId}/einladungen:
    get:
      description: Ohne Klartext - den trägt nur der Brief (docs/adr/ADR-048-vorgangszugang-mit-einmalkennwort.md).
      operationId: einladungenDerPerson
      parameters:
      - in: path
        name: personId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/EinladungView'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Einladungen einer Person
      tags:
      - Mock Personenverzeichnis
    post:
      description: Antwortet mit dem Brief, der das Einmalkennwort im Klartext trägt.
      operationId: einladungAusstellen
      parameters:
      - in: path
        name: personId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EinladungAusstellenRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BriefView'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Einladung mit Einmalkennwort ausstellen
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/personen/{personId}/freischaltcodes:
    get:
      description: Ohne Klartext - den trägt nur der Brief.
      operationId: freischaltcodes
      parameters:
      - in: path
        name: personId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/FreischaltcodeView'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Freischaltcodes einer Person
      tags:
      - Mock Personenverzeichnis
    post:
      description: Antwortet mit dem Brief, der den Klartext trägt.
      operationId: ausstellen
      parameters:
      - in: path
        name: personId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreischaltcodeAusstellenRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BriefView'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Freischaltcode ausstellen
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/texts/{lang}:
    get:
      operationId: texts
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Texte des Dienstes in einer Sprache (mit ETag)
      tags:
      - Mock Personenverzeichnis
  /mock-personenverzeichnis/vorgaenge:
    get:
      operationId: vorgaenge
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/Vorgang'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/ErrorResponse
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Vorgänge, zu denen das Verzeichnis einlädt
      tags:
      - Mock Personenverzeichnis
tags:
- description: 'SMS-TAN: Einrichtung als Faktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: SMS'
- description: Gerätebindung über den externen Dienstleister KOBIL
  name: 'Tool: KOBIL'
- description: 'Geraetebindung: Einrichtung und Anmeldung ueber den Geraeteschluessel'
  name: 'Tool: Gerät'
- description: 'Passwort: Einrichtung als Wissensfaktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: Passwort'
- description: 'E-Mail: Bestaetigung der Adresse, Anmeldung und Login ohne DPoP'
  name: 'Tool: E-Mail'
- description: 'QR-Pairing: Freigabe eines Web-Kanals aus einer bereits angemeldeten App'
  name: 'Tool: QR-Login'
- description: Simuliertes Personenverzeichnis - kein Endpunkt dieser Anwendung, sondern das Fremdsystem
  name: Mock Personenverzeichnis
