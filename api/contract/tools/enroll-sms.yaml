components:
  schemas:
    ChannelResponse:
      properties:
        stepData:
          $ref: '#/components/schemas/StepData'
          description: Whatever the current step needs to render. `kind` names the shape - see StepData.
      type: object
    EnrollSmsPatchRequest:
      properties:
        phoneNumber:
          example: +49 170 1234567
          type: string
        tan:
          example: '123456'
          type: string
      type: object
    EnrollSmsStep:
      description: Waiting for the phone number or its TAN; `replaces` says the account already has a number.
      properties:
        kind:
          enum:
          - enroll-sms
          type: string
        missingFields:
          example:
          - phoneNumber
          items:
            type: string
          type: array
        replaces:
          example: false
          type: boolean
      required:
      - kind
      - missingFields
      - replaces
    ErrorResponse:
      type: object
    StepData:
      description: What the current step needs to render. `kind` names the shape; see the mapping on this schema for the ones
        this deployment can produce.
      discriminator:
        mapping:
          enroll-sms: '#/components/schemas/EnrollSmsStep'
        propertyName: kind
      oneOf:
      - $ref: '#/components/schemas/EnrollSmsStep'
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing Keycloak facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /orchestrator/api/v1/channels/{channelSessionId}/tools/enroll-sms:
    post:
      description: 'No request body: toolId already carries kind and method.'
      operationId: activate_4
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  step: enroll
                  toolId: enroll-sms
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Activate enroll-sms
      tags:
      - 'Tool: SMS'
  /orchestrator/api/v1/tools/{toolSessionId}/enroll-sms:
    get:
      operationId: read_4
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  step: tanInput
                  toolId: enroll-sms
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Read the current enroll-sms state
      tags:
      - 'Tool: SMS'
    patch:
      description: First call with phoneNumber triggers the TAN send; a second call with tan confirms it.
      operationId: patch_4
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollSmsPatchRequest'
      responses:
        '200':
          content:
            application/json:
              examples:
                After phoneNumber - TAN sent:
                  description: After phoneNumber - TAN sent
                  value:
                    channel:
                      channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      state: REGISTERING
                    demo:
                      tan: '123456'
                    next:
                      step: tanInput
                      toolId: enroll-sms
                      toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                      type: tool
                After tan - enrolled, chain continues:
                  description: After tan - enrolled, chain continues
                  value:
                    channel:
                      channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      state: REGISTERING
                    next:
                      context: enrollment
                      step: selectMethod
                      type: orchestrator
                    stepData:
                      kind: select-method
                      options:
                      - confirm-email
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Supply phone number, then TAN
      tags:
      - 'Tool: SMS'
tags:
- description: 'SMS-TAN: Einrichtung als Faktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: SMS'
