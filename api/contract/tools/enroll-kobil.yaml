components:
  schemas:
    ChannelResponse:
      properties:
        stepData:
          $ref: '#/components/schemas/StepData'
          description: Whatever the current step needs to render. `kind` names the shape - see StepData.
      type: object
    EnrollKobilPatchRequest:
      properties:
        activated:
          example: true
          type: boolean
        biometricConsent:
          example: true
          type: boolean
        label:
          example: Diensthandy
          type: string
      type: object
    ErrorResponse:
      type: object
    KobilActivationStep:
      description: What the KOBIL SDK needs to activate this device.
      properties:
        activationCode:
          type: string
        kind:
          enum:
          - kobil-activation
          type: string
        kobilUserId:
          type: string
        missingFields:
          items:
            type: string
          type: array
        pin:
          type: string
        tenantId:
          type: string
        unlockSecret:
          type: string
      required:
      - activationCode
      - kind
      - kobilUserId
      - missingFields
      - pin
      - tenantId
    KobilOtpStep:
      description: Waiting for the one-time password the KOBIL SDK produced.
      properties:
        kind:
          enum:
          - kobil-otp
          type: string
        kobilPin:
          type: string
        kobilUserId:
          type: string
        missingFields:
          example:
          - otp
          items:
            type: string
          type: array
        tenantId:
          type: string
      required:
      - kind
      - kobilUserId
      - missingFields
      - tenantId
    KobilUnlockStep:
      description: The app must unlock the backend-held PIN; these are the accepted ways.
      properties:
        kind:
          enum:
          - kobil-unlock
          type: string
        kobilUserId:
          type: string
        tenantId:
          type: string
        unlockOptions:
          example:
          - biometric
          - password
          items:
            type: string
          type: array
      required:
      - kind
      - kobilUserId
      - tenantId
      - unlockOptions
    StepData:
      description: What the current step needs to render. `kind` names the shape; see the mapping on this schema for the ones
        this deployment can produce.
      discriminator:
        mapping:
          kobil-activation: '#/components/schemas/KobilActivationStep'
          kobil-otp: '#/components/schemas/KobilOtpStep'
          kobil-unlock: '#/components/schemas/KobilUnlockStep'
        propertyName: kind
      oneOf:
      - $ref: '#/components/schemas/KobilActivationStep'
      - $ref: '#/components/schemas/KobilOtpStep'
      - $ref: '#/components/schemas/KobilUnlockStep'
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing Keycloak facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /orchestrator/api/v1/channels/{channelSessionId}/tools/enroll-kobil:
    post:
      description: Provisions the KOBIL user and returns everything the app's SDK needs for its activation call - including
        the PIN, which this backend mints and keeps.
      operationId: activate_7
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - fsc
                  state: AUTHENTICATED
                next:
                  step: activate
                  toolId: enroll-kobil
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
                stepData:
                  activationCode: K7M2PQX9
                  kind: kobil-activation
                  kobilUserId: kob-1a2b3c4d5e6f
                  missingFields:
                  - activated
                  - biometricConsent
                  pin: '40318827'
                  tenantId: identity-demo
                  unlockSecret: xE1r...
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Activate enroll-kobil
      tags:
      - 'Tool: KOBIL'
  /orchestrator/api/v1/tools/{toolSessionId}/enroll-kobil:
    get:
      operationId: read_7
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Read the current enroll-kobil state
      tags:
      - 'Tool: KOBIL'
    patch:
      description: Records the credential once KOBIL reports a bound device for this user.
      operationId: patch_7
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollKobilPatchRequest'
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - fsc
                  - kobil
                  - biometric
                  state: AUTHENTICATED
                next:
                  context: authentication
                  step: authenticated
                  type: orchestrator
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Confirm the KOBIL activation
      tags:
      - 'Tool: KOBIL'
tags:
- description: Gerätebindung über den externen Dienstleister KOBIL
  name: 'Tool: KOBIL'
