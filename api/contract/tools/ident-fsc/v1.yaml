components:
  schemas:
    ChannelResponse:
      type: object
    ErrorResponse:
      type: object
    IdentFscPatchRequest:
      properties:
        birthDate:
          example: '1985-06-15'
          format: date
          type: string
        familyName:
          example: Muster
          type: string
        fsc:
          example: VALIDCODE
          type: string
        givenNames:
          example: Max
          type: string
        kvnr:
          example: A123456789
          type: string
        partnerNumber:
          example: P000000004
          type: string
      type: object
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing Keycloak facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /tools/api/ident-fsc/v1:
    post:
      description: 'No request body: toolId already carries kind and method.'
      operationId: activate_2
      parameters:
      - in: query
        name: channel
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  step: input
                  toolId: ident-fsc
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Activate ident-fsc
      tags:
      - 'Tool: Freischaltcode'
  /tools/api/ident-fsc/v1/{toolSessionId}:
    get:
      operationId: read_2
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  step: input
                  toolId: ident-fsc
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Read the current ident-fsc state
      tags:
      - 'Tool: Freischaltcode'
    patch:
      description: Only the fields being supplied or corrected need to be sent; all five together also resolves in one call.
      operationId: patch_2
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentFscPatchRequest'
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: REGISTERING
                next:
                  context: enrollment
                  step: selectMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - enroll-sms
                  - enroll-device
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Identified - the journey now chains toward the required loa2 (2nd factor + confirmed email).
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Supply KVNR/name/givenNames/birthDate/FSC
      tags:
      - 'Tool: Freischaltcode'
tags:
- description: KVNR/name/givenNames/birthDate/FSC identification
  name: 'Tool: Freischaltcode'
