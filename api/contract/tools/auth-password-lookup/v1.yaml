components:
  schemas:
    AuthPasswordLookupPatchRequest:
      properties:
        email:
          example: max.mustermann@example.com
          type: string
        password:
          example: Passwort!23
          type: string
      type: object
    ChannelResponse:
      properties:
        stepData:
          $ref: '#/components/schemas/StepData'
          description: Whatever the current step needs to render. `kind` names the shape - see StepData.
      type: object
    EnrollPasswordStep:
      description: Waiting for the password to set; `replaces` says the account already has one.
      properties:
        kind:
          enum:
          - enroll-password
          type: string
        missingFields:
          example:
          - password
          items:
            type: string
          type: array
        replaces:
          example: false
          type: boolean
      required:
      - kind
      - missingFields
      - replaces
    ErrorResponse:
      type: object
    StepData:
      description: What the current step needs to render. `kind` names the shape; see the mapping on this schema for the ones
        this deployment can produce.
      discriminator:
        mapping:
          enroll-password: '#/components/schemas/EnrollPasswordStep'
        propertyName: kind
      oneOf:
      - $ref: '#/components/schemas/EnrollPasswordStep'
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing Keycloak facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /tools/api/auth-password-lookup/v1:
    post:
      description: 'No request body: toolId already carries kind and method.'
      operationId: activate_17
      parameters:
      - in: query
        name: channel
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  step: auth
                  toolId: auth-password-lookup
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Activate auth-password-lookup
      tags:
      - 'Tool: Passwort'
  /tools/api/auth-password-lookup/v1/{toolSessionId}:
    get:
      operationId: read_16
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  step: auth
                  toolId: auth-password-lookup
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Read the current auth-password-lookup state
      tags:
      - 'Tool: Passwort'
    patch:
      operationId: patch_16
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordLookupPatchRequest'
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa1
                  currentAmr:
                  - password
                  state: AUTHENTICATED
                next:
                  context: authentication
                  step: offerDeviceBinding
                  type: orchestrator
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Correct email+password - logged in, offered the optional device-binding.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Supply email and password together (self-verifying, single call)
      tags:
      - 'Tool: Passwort'
tags:
- description: 'Passwort: Einrichtung als Wissensfaktor, Anmeldung und Login ohne DPoP'
  name: 'Tool: Passwort'
