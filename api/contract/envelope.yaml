components:
  schemas:
    ActiveMethodView:
      description: 'One active authentication method instance. `id` addresses it for DELETE .../methods/{id} - method name
        alone isn''t unique when a method allows multiple instances (e.g. several active `device` entries, one per physical
        device). `label` is a user-chosen display name, set only for multi-instance methods; `null` for singleton ones (email/sms/password),
        which the client labels from `method` itself. `enrolledUnderAcr`/`maxAcr`/`effectiveAcr`/`factorTypes` surface the
        ADR-5 three-way cap (docs/12-entscheidungen.md): `effectiveAcr` is `min(enrolledUnderAcr, maxAcr)`, the level this
        method can actually contribute right now, which can be lower than the tool''s own declared `maxAcr` if it was enrolled
        while the session had proven less.'
      properties:
        changeable:
          description: 'Whether the credential can be changed in place (POST .../methods/{id}/changes): a new password, a
            new number.'
          type: boolean
        effectiveAcr:
          description: min(enrolledUnderAcr, maxAcr) - what this method actually contributes today.
          example: loa1
          type: string
        enrolledUnderAcr:
          description: The level the session had already proven at the moment this method was enrolled (ADR-5) - caps effectiveAcr
            below maxAcr if lower.
          example: loa1
          type: string
        factorTypes:
          example:
          - POSSESSION
          items:
            enum:
            - KNOWLEDGE
            - POSSESSION
            - INHERENCE
            type: string
          type: array
        id:
          example: 7f3e2b1a-0c9d-4e8f-8a1b-2c3d4e5f6a7b
          type: string
        label:
          example: Laptop
          type: string
        maxAcr:
          description: This tool's own declared ceiling - never account/session-specific.
          example: loa2
          type: string
        method:
          example: sms
          type: string
      required:
      - id
      - method
      type: object
    AnswerRequest:
      description: 'An answer to whatever the current step is waiting on instead of a tool run (docs/04-orchestrierung.md
        #3) - e.g. "accept"/"decline" for the optional device-binding offer of a lookup login. Which values are valid depends
        on what next.step is currently offering.'
      properties:
        answer:
          example: accept
          type: string
      required:
      - answer
      type: object
    AuthData:
      properties:
        acr:
          example: loa2
          type: string
        amr:
          additionalProperties:
            type: string
          description: 'Method -> who proved it: "orchestrator" for a completed orchestrator tool, "kc" for evidence a native
            Keycloak authenticator already established (docs/05-api.md Abschnitt 3b). Informational only - the orchestrator
            alone still resolves the combined acr above, regardless of source.'
          example:
            password: kc
            sms: orchestrator
          type: object
        subject:
          $ref: '#/components/schemas/AuthSubject'
      type: object
    AuthSubject:
      properties:
        id:
          example: '42'
          type: string
        type:
          enum:
          - account
          - invitation
          type: string
      required:
      - id
      - type
      type: object
    BoundCredentialView:
      properties:
        method:
          example: kobil
          type: string
        reference:
          example: dev-1a2b3c4d5e6f
          type: string
      required:
      - method
      - reference
      type: object
    ChannelBlock:
      properties:
        activeMethods:
          description: All active authentication methods on the account, regardless of whether this session's currentAmr proved
            them. currentAmr is session evidence (what THIS channel actually proved); activeMethods is the account's full
            standing method list, unfiltered by device - a lost/stolen device's credential must be removable from any authenticated
            session, not only from that device itself.
          items:
            $ref: '#/components/schemas/ActiveMethodView'
          type: array
        channelSessionId:
          format: uuid
          type: string
        channelType:
          description: Which facade this channel was opened through - APP (DPoP) or WEB (docs/02-domaenenmodell.md Abschnitt
            1). Fixed for the channel's whole lifetime.
          example: APP
          type: string
        currentAcr:
          example: loa2
          type: string
        currentAmr:
          example:
          - sms
          - password
          items:
            type: string
          type: array
        hasProvenFactor:
          description: Whether this session has already proven at least one factor (an identification or a method) - what
            cancelling the running journey would throw away. Lets a client ask "really discard?" only when there is something
            to lose. Set on every response, tool responses included; says nothing about which factor.
          example: false
          type: boolean
        state:
          example: AUTHENTICATED
          type: string
      required:
      - channelSessionId
      - channelType
      - hasProvenFactor
      - state
      type: object
    ChannelCreateRequest:
      description: 'requiredAcr is a lower bound only. Always creates a brand-new ChannelSession for this device (docs/02-domaenenmodell.md
        #3) - DPoP proves the device, never a lookup key for resuming a session. To end a previous session first (logout),
        call DELETE .../channels/{channelSessionId} before this.'
      properties:
        availableTools:
          description: The tools this client supports and has enabled, each as <toolId>@<version> in the one version it speaks
            (ADR-51, docs/03-tool-architektur.md, availability) - e.g. GET /tools/catalog minus whatever the user turned off
            locally. Fixed for this channel's whole lifetime; a candidate list never offers a tool outside this set, and activating
            one directly or in another version fails too. An entry without its version, or one tool in two versions, is rejected.
          example:
          - ident-fsc@1
          - enroll-sms@1
          - auth-sms@1
          items:
            type: string
          minItems: 1
          type: array
        intent:
          description: 'The entry intent''s own name, case-insensitively (AuthIntent.fromRequest) - no separate wire vocabulary.
            Omitted/fast_access (default): DeviceAccountLink found -> LOGIN, else REGISTRATION. lookup_login: always offers
            lookup-based login (email + credential), even on a linked device. register: always starts fresh REGISTRATION,
            even on a linked device (second account). confirm_peer_login: a cold app approves a waiting web login (QR pairing)
            for the device''s linked account.'
          enum:
          - fast_access
          - register
          - lookup_login
          - confirm_peer_login
          example: register
          type: string
        requiredAcr:
          example: loa2
          type: string
      required:
      - availableTools
      type: object
    ChannelPatchRequest:
      description: Raises the channel's durable required-ACR floor; the step-up trigger of the App channel (docs/05-api.md,
        step-ups).
      properties:
        requiredAcr:
          example: loa3
          type: string
      required:
      - requiredAcr
      type: object
    ChannelResponse:
      properties:
        authData:
          $ref: '#/components/schemas/AuthData'
          description: WEB channels only (docs/05-api.md Abschnitt 3b) - never present for APP.
        channel:
          $ref: '#/components/schemas/ChannelBlock'
        demo:
          $ref: '#/components/schemas/DemoInfo'
          description: Demo-only correlation IDs, never part of the production contract.
        next:
          $ref: '#/components/schemas/Next'
        stepData:
          $ref: '#/components/schemas/StepData'
          description: Whatever the current step needs to render. `kind` names the shape - see StepData.
      required:
      - channel
      type: object
    Confirm:
      allOf:
      - $ref: '#/components/schemas/Prompt'
      - properties:
          cancelLabel:
            $ref: '#/components/schemas/TextRef'
          confirmLabel:
            $ref: '#/components/schemas/TextRef'
          destructive:
            type: boolean
        type: object
      required:
      - cancelLabel
      - confirmLabel
      - title
    ConfirmStep:
      description: The step waits for a yes/no answer; the prompt is authored by the backend.
      properties:
        kind:
          enum:
          - confirm
          type: string
        prompt:
          $ref: '#/components/schemas/Prompt'
      required:
      - kind
      - prompt
    DemoInfo:
      additionalProperties: true
      properties:
        accountId:
          example: 42
          format: int64
          type: integer
        journeys:
          description: The running journey chain for this channel, outermost first - see [JourneyDebugStep]. Empty once nothing
            is running.
          items:
            $ref: '#/components/schemas/JourneyDebugStep'
          type: array
        personId:
          example: P000000001
          type: string
        session:
          $ref: '#/components/schemas/DemoSession'
          description: 'Demo-only: who this session belongs to and what it has proven so far - in every response, tool responses
            included, so a demo view can show it at any step. The production contract keeps these on the channel resource
            only (ChannelBlock).'
      type: object
    DemoSession:
      properties:
        acr:
          example: loa1
          type: string
        amr:
          example:
          - sms
          items:
            type: string
          type: array
        authenticated:
          description: Whether the session is signed in (channel state AUTHENTICATED).
          type: boolean
        personName:
          description: '"Vorname Name" of the person behind the account, if one is bound.'
          example: Max Muster
          type: string
      required:
      - authenticated
      type: object
    DeviceLinkResponse:
      description: 'Whether this device''s DPoP key is already linked to an account (DeviceAccountLink, docs/02-domaenenmodell.md
        #1) - a pure read, no channel/journey created. Lets the entry screen show "this device belongs to X" before the user
        picks how to start.'
      properties:
        accountId:
          example: 42
          format: int64
          type: integer
        boundCredentials:
          description: 'Demo-only: what else this device is known by - one entry per key-bound credential of the linked account
            living on THIS key, with the reference its own method discloses (docs/09-dpop.md). The `device` method names its
            credential key, `kobil` the identifier the provider gave this phone. Absence is meaningful: a client that holds
            local data for a method no longer listed here is holding something stale.'
          items:
            $ref: '#/components/schemas/BoundCredentialView'
          type: array
        linked:
          type: boolean
      required:
      - linked
      type: object
    ErrorResponse:
      description: |-
        Every error response has this shape. The HTTP status is fixed per `error` code:

        - `BAD_REQUEST`: 400
        - `UNAUTHORIZED`: 401
        - `BINDING_MISMATCH`: 403
        - `NOT_FOUND`: 404
        - `INVALID_STATE_TRANSITION`: 409
        - `CONCURRENT_MODIFICATION`: 409
        - `PROCESS_GONE`: 410
        - `PROCESS_ABORTED`: 410
        - `UNRESOLVABLE_REFERENCE`: 422
        - `ACCOUNT_LOCKED`: 423
        - `TOO_MANY_REQUESTS`: 429
        - `INTERNAL_ERROR`: 500

        A client must expect a code it does not know and handle it by its HTTP status.
      properties:
        error:
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - BINDING_MISMATCH
          - NOT_FOUND
          - INVALID_STATE_TRANSITION
          - CONCURRENT_MODIFICATION
          - PROCESS_GONE
          - PROCESS_ABORTED
          - UNRESOLVABLE_REFERENCE
          - ACCOUNT_LOCKED
          - TOO_MANY_REQUESTS
          - INTERNAL_ERROR
          type: string
        text:
          $ref: '#/components/schemas/TextRef'
      required:
      - error
      - text
    FailedAttemptStep:
      description: The attempt failed; retries remain.
      properties:
        error:
          $ref: '#/components/schemas/TextRef'
        kind:
          enum:
          - failed-attempt
          type: string
      required:
      - error
      - kind
    JourneyDebugStep:
      properties:
        intent:
          example: DELETE_ACCOUNT
          type: string
        journeyId:
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          type: string
        lifecycle:
          example: SUSPENDED
          type: string
        note:
          $ref: '#/components/schemas/TextRef'
          description: 'Demo-only: why this journey''s current step looks the way it does - either why its tool became the
            automatic choice, or why a selection among several is being shown at all. Null whenever the step already explains
            itself (e.g. a Prompt), never part of the production contract.'
        purpose:
          $ref: '#/components/schemas/TextRef'
          description: 'Demo-only: what this journey''s current position is for - the orchestrator''s reason for being here
            at all, set for every journey in the chain. Never part of the production contract.'
        stateType:
          example: ConfirmPending
          type: string
      required:
      - intent
      - journeyId
      - lifecycle
      - stateType
      type: object
    MessageStep:
      description: A single candidate was auto-activated; this explains why the step appears.
      properties:
        kind:
          enum:
          - message
          type: string
        message:
          $ref: '#/components/schemas/TextRef'
      required:
      - kind
      - message
    MethodsResponse:
      description: 'The account''s active authentication methods (docs/05-api.md #3a). Never contains fsc.'
      properties:
        methods:
          items:
            $ref: '#/components/schemas/ActiveMethodView'
          type: array
      required:
      - methods
      type: object
    MissingFields:
      description: Which inputs this step is still waiting for.
      properties:
        kind:
          enum:
          - missing-fields
          type: string
        missingFields:
          example:
          - tan
          items:
            type: string
          type: array
      required:
      - kind
      - missingFields
    Next:
      properties:
        context:
          example: authentication
          type: string
        step:
          example: auth
          type: string
        toolId:
          example: auth-sms
          type: string
        toolSessionId:
          format: uuid
          type: string
        type:
          example: tool
          type: string
      required:
      - step
      - type
      type: object
    Prompt:
      discriminator:
        mapping:
          Confirm: '#/components/schemas/Confirm'
        propertyName: kind
      properties:
        description:
          $ref: '#/components/schemas/TextRef'
        kind:
          type: string
        title:
          $ref: '#/components/schemas/TextRef'
      required:
      - kind
    SelectMethodStep:
      description: Several procedures are possible; the client shows a selection.
      properties:
        description:
          $ref: '#/components/schemas/TextRef'
        kind:
          enum:
          - select-method
          type: string
        options:
          example:
          - auth-password
          - auth-device
          items:
            type: string
          type: array
        title:
          $ref: '#/components/schemas/TextRef'
      required:
      - kind
      - options
    StepData:
      description: What the current step needs to render. `kind` names the shape; see the mapping on this schema for the ones
        this deployment can produce.
      discriminator:
        mapping:
          confirm: '#/components/schemas/ConfirmStep'
          failed-attempt: '#/components/schemas/FailedAttemptStep'
          message: '#/components/schemas/MessageStep'
          missing-fields: '#/components/schemas/MissingFields'
          select-method: '#/components/schemas/SelectMethodStep'
        propertyName: kind
      oneOf:
      - $ref: '#/components/schemas/ConfirmStep'
      - $ref: '#/components/schemas/FailedAttemptStep'
      - $ref: '#/components/schemas/MessageStep'
      - $ref: '#/components/schemas/MissingFields'
      - $ref: '#/components/schemas/SelectMethodStep'
    TextRef:
      description: 'A text reference: look `key` up in the texts bundle (GET .../texts/{lang}), fill `{name}` placeholders
        from `args` (as is) or `texts` (resolved the same way, several joined with ", ").'
      properties:
        args:
          additionalProperties:
            type: string
          type: object
        key:
          example: account-not-found-08a2ef
          type: string
        template:
          description: The developer's wording, sent only while the texts bundle has none for key yet - show it instead of
            the key.
          type: string
        texts:
          additionalProperties:
            items:
              $ref: '#/components/schemas/TextRef'
            type: array
          type: object
      required:
      - key
    TokenResponse:
      description: Mock Keycloak AccessToken (a spec-shaped unsecured JWT, alg=none - parse and display its payload, no verification
        needed) plus both token lifetimes. The RefreshToken value itself is deliberately never part of this response - it's
        a credential and stays server-side; refreshExpiresAt is the only thing about it exposed.
      properties:
        accessExpiresAt:
          example: '2026-08-28T18:05:00Z'
          format: date-time
          type: string
        accessToken:
          example: eyJhbGciOiJub25lIn0.eyJzdWIiOiI0MiIsImFjciI6ImxvYTIiLCJhbXIiOlsic21zIl19.
          type: string
        refreshExpiresAt:
          example: '2026-08-29T18:00:00Z'
          format: date-time
          type: string
        tokenType:
          type: string
      required:
      - accessExpiresAt
      - accessToken
      - refreshExpiresAt
      type: object
    ToolCatalogEntry:
      properties:
        hint:
          $ref: '#/components/schemas/TextRef'
        method:
          example: sms
          type: string
        name:
          $ref: '#/components/schemas/TextRef'
        role:
          example: KNOWN_ACCOUNT_AUTH
          type: string
        toolId:
          example: auth-sms
          type: string
        versions:
          example:
          - 1
          items:
            format: int32
            type: integer
          type: array
      required:
      - hint
      - method
      - name
      - role
      - toolId
      - versions
      type: object
  securitySchemes:
    dpop:
      description: DPoP proof JWT, one per request, bound to method and URL (docs/09-dpop.md). The App channel's proof; the
        binding key is derived from it and is never supplied by the caller.
      in: header
      name: DPoP
      type: apiKey
info:
  description: App-facing (orchestrator-first) API for the DPoP-bound registration and login demo. See docs/05-api.md for
    the full contract; the Keycloak-facing Keycloak facade is out of scope for this build (docs/08-projektrahmen.md).
  title: Identity-Demo Orchestrator API
  version: v1
openapi: 3.1.0
paths:
  /orchestrator/api/v1/app/channels:
    post:
      description: 'Always mints a brand-new ChannelSession for this DPoP-bound device (docs/02-domaenenmodell.md #3: the
        key proves the device, never a lookup key for resuming a session - use GET with a remembered channelSessionId to resume).
        A device that was already registered still gets offered LOGIN, not a fresh ident-fsc. To end a previous session first
        (logout), call DELETE on it before this.'
      operationId: createChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  context: registration
                  step: selectIdentificationMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - ident-fsc
                  - ident-eid
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: New channel - an unrecognized device lands on the identification choice.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Create a new App channel
      tags:
      - App channels
  /orchestrator/api/v1/app/channels/device-link:
    get:
      description: 'A pure read (docs/02-domaenenmodell.md #1) - no channel/journey created, just the same DPoP proof every
        other App-facade call already needs. Lets the entry screen show whose device this is before the user picks how to
        start.'
      operationId: getDeviceLink
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeviceLinkResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Whether this device is already linked to an account
      tags:
      - App channels
  /orchestrator/api/v1/channels/{channelSessionId}:
    delete:
      description: 'Ends this channel for good (docs/02-domaenenmodell.md #3: AUTHENTICATED -> LOGGED_OUT, terminal) - cancels
        any active process and discards the AppTokenSession. For interactive clients prefer POST .../logouts which shows a
        confirmation prompt first. Never resumes on this channelSessionId afterwards; call POST .../channels again for a new
        session (a known device still skips straight to LOGIN there).'
      operationId: logout
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Logged out - no body.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Log out (direct, no confirmation)
      tags:
      - Channels
    get:
      description: 'The guaranteed resume entry point (docs/05-api.md #3a): next always reflects the currently due step.'
      operationId: getChannel
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa1
                  state: STEP_UP_IN_PROGRESS
                next:
                  step: auth
                  toolId: auth-sms
                  toolSessionId: 9c858901-8a57-4791-81fe-4c455b099bc9
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Resumed mid-step-up, waiting on an SMS TAN.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Read the current channel state
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/account-deletions:
    post:
      description: Channel must already be AUTHENTICATED. Starts an unconditional yes/no confirmation (next.context=prompt,
        next.step=confirm, stepData.prompt - the same generic address every AnswerableState uses) that always comes FIRST,
        before anything else is checked. Only once accepted does the loa2 gate apply (a step-up first if not yet reached);
        if that gate needed a step-up, its own fresh proof is enough and deletion follows immediately, otherwise one more
        fresh re-proof of any active factor is required - never skipped just because the session already carried loa2. On
        success the account and everything it owns is hard-deleted, every ChannelSession it was ever bound to is logged out
        server-side, and this response's channel.state is LOGGED_OUT with no next, exactly like a plain logout.
      operationId: deleteAccount
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: AUTHENTICATED
                next:
                  context: prompt
                  step: confirm
                  type: orchestrator
                stepData:
                  kind: confirm
                  prompt:
                    cancelLabel: Abbrechen
                    confirmLabel: Account löschen
                    destructive: true
                    kind: Confirm
                    title: Account wirklich löschen?
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Confirmation prompt for the account deletion.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Delete the account of an already authenticated channel
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/answer:
    post:
      description: 'Generic answer endpoint for any state that pauses for an explicit yes/no instead of a tool run (next.context=prompt,
        next.step=confirm, stepData.prompt) - the optional device-binding offer right after a lookup login, the account-deletion
        confirmation, and any future one alike, all through this same address, answer="accept"/"decline". For device binding
        specifically: agreeing is the ONLY way such a login ever makes this device recognizable for future logins - it never
        happens as a side effect, because this intent is chosen precisely by people who want no device binding.'
      operationId: answer
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa1
                  currentAmr:
                  - password
                  state: AUTHENTICATED
                next:
                  context: authentication
                  step: authenticated
                  type: orchestrator
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Device binding accepted after a lookup login - journey settles into authenticated.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Answer whatever the current step is waiting on
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/attributes/{attribute}:
    delete:
      description: 'Sibling of the methods endpoint, for what is NOT a credential: an account-owned fact, today only the confirmed
        address (`email`). Same gate, and the same refusal (409) when the consequences would drop the account below this channel''s
        required level - consequences being the point: every credential that required the attribute is withdrawn with it,
        transitively. Removing the address therefore also removes a password enrolled against it, and a KOBIL binding that
        in turn required that password.'
      operationId: retractAttribute
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: attribute
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - fsc
                  state: AUTHENTICATED
                next:
                  context: authentication
                  step: authenticated
                  type: orchestrator
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: The address was withdrawn; nothing required it.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Withdraw a confirmed account attribute
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/enrollments:
    post:
      description: Channel must already be AUTHENTICATED. Offers AuthPolicy.enrollmentCandidates via the existing enroll-*
        tools, unchanged; finishing does not require reaching any particular level - one successful enrollment ends this and
        returns to AUTHENTICATED. Call again to add another.
      operationId: manageMethods
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - sms
                  - password
                  state: AUTHENTICATED
                next:
                  context: enrollment
                  step: selectMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - enroll-device
                  - confirm-email
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Already AUTHENTICATED with sms+password - offered the still-missing methods.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Voluntarily add another authentication method
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/idclaims:
    get:
      description: 'Business-facing claims (accountId/personId/versnr/name/email/acr/amr/auth_time) - a separate resource
        from the AccessToken''s own claims, not encoded into it. name is the one place the client learns who is logged in
        (docs/05-api.md); personId and versnr give the role (ADR-34): Versicherter with versnr, Partner with personId only,
        Interessent with neither.'
      operationId: getIdClaims
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                accountId: 42
                acr: loa2
                amr:
                - sms
                - password
                auth_time: 1798567890
                email: max.mustermann@example.com
                name: Max Muster
                personId: P000000001
                versnr: '10000001'
              schema:
                additionalProperties: true
                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Get the business ID-token claims
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/journey:
    delete:
      description: Abandons the currently running AuthJourney, whatever intent started it; the response already offers a fresh
        start where applicable.
      operationId: cancel
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  step: input
                  toolId: ident-fsc
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: A cancelled REGISTER journey restarts the same entry intent from scratch.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Cancel the current journey
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/logouts:
    post:
      description: Channel must already be AUTHENTICATED. Starts a LOGOUT journey with a confirmation prompt (next.context=prompt,
        next.step=confirm, stepData.prompt). On accept (via POST .../answer) the channel ends for good (AUTHENTICATED -> LOGGED_OUT,
        terminal). On decline the channel stays AUTHENTICATED. Analogous to POST .../account-deletions.
      operationId: startLogout
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Confirmation prompt for the logout.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Start a confirmed logout
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/methods:
    get:
      description: 'The methods collection as a real readable resource - identical data to ChannelResponse''s activeMethods
        (docs/05-api.md #3a), just addressable on its own. Never includes fsc (identification is recorded as an IDENTIFIED
        entry in the account change log, not in authenticationMethods). Empty list, not an error, when no account is known
        yet for this channel.'
      operationId: getMethods
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                methods:
                - id: 7f3e2b1a-0c9d-4e8f-8a1b-2c3d4e5f6a7b
                  method: sms
                - id: b2d4f6a8-1c3e-4a5b-9d7f-8e0a1b2c3d4e
                  label: Laptop
                  method: device
              schema:
                $ref: '#/components/schemas/MethodsResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Read the account's active authentication methods
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/methods/{methodInstanceId}:
    delete:
      description: Channel must already be AUTHENTICATED and the instance currently active. Addressed by its own id (GET .../methods),
        never by method name - a method can have several active instances (e.g. multiple devices). Rejected (409) if removing
        it would drop the account below this channel's own required level.
      operationId: deactivateMethod
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: methodInstanceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  activeMethods:
                  - id: 7f3e2b1a-0c9d-4e8f-8a1b-2c3d4e5f6a7b
                    method: password
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa1
                  currentAmr:
                  - password
                  state: AUTHENTICATED
                next:
                  context: authentication
                  step: authenticated
                  type: orchestrator
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: The sms method instance was removed - password alone still satisfies loa1.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Deactivate an authentication method instance
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/methods/{methodInstanceId}/changes:
    post:
      description: Channel must already be AUTHENTICATED and the instance active and `changeable` (GET .../methods). Runs
        the method's own enroll-* tool again; the new credential replaces this instance once it is complete, until then the
        old one stays. Same gate as adding or removing a method, and never below the level the instance was enrolled under.
        404 for an instance that is not active, 409 for a method that cannot be changed (one credential per device, or none
        of its own).
      operationId: changeMethod
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: methodInstanceId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  currentAmr:
                  - sms
                  - password
                  state: AUTHENTICATED
                next:
                  step: enroll
                  toolId: enroll-password
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: The password is about to be changed - its enrollment is the one tool on offer.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Change an authentication method in place
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/peer-logins:
    post:
      description: Channel must already be AUTHENTICATED (docs/04-orchestrierung.md, CONFIRM_PEER_LOGIN). Same AuthIntent.CONFIRM_PEER_LOGIN
        as the cold-entry path via POST /app/channels - gates on loa2 (step-up offered first if below it), then offers approve-qr
        as the one candidate.
      operationId: confirmPeerLogin
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  state: STEP_UP_IN_PROGRESS
                next:
                  step: input
                  toolId: approve-qr
                  type: tool
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Already at loa2 - approve-qr offered directly.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Confirm a WEB-channel QR login from this already-authenticated APP channel
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/step-ups:
    post:
      description: The App channel's step-up trigger (docs/05-api.md, step-ups). Only raises, never lowers.
      operationId: raiseRequiredAcr
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelPatchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa2
                  state: STEP_UP_IN_PROGRESS
                next:
                  context: auth
                  step: selectMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - auth-sms
                  - auth-password
                  - auth-device
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: loa3 requested, current evidence (loa2) doesn't satisfy it - offers the candidate methods.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Raise the channel's required ACR floor
      tags:
      - Channels
  /orchestrator/api/v1/channels/{channelSessionId}/token:
    get:
      description: 'Covers both first issuance and refresh - call this again whenever a fresh token might be needed. minValiditySeconds
        (default 15) is the caller''s tolerance: if the current AccessToken still has at least that much life left, it comes
        back unchanged; otherwise the backend mints a new one (silently using the remembered RefreshToken where possible).
        The RefreshToken value itself is never returned - it''s a credential and stays server-side.'
      operationId: getToken
      parameters:
      - in: path
        name: channelSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: minValiditySeconds
        required: false
        schema:
          default: 15
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                accessExpiresAt: '2026-08-28T18:05:00Z'
                accessToken: eyJhbGciOiJub25lIn0.eyJzdWIiOiI0MiIsImFjciI6ImxvYTIiLCJhbXIiOlsic21zIl19.
                refreshExpiresAt: '2026-08-29T18:00:00Z'
                tokenType: Bearer
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Get the mock Keycloak AccessToken
      tags:
      - Channels
  /orchestrator/api/v1/texts/{lang}:
    get:
      description: 'Map of text id to wording with `{name}` placeholders. `lang` is de or en (a region like en-GB counts as
        en, anything else falls back to de; Content-Language says which). Send the ETag back as If-None-Match: 304 while unchanged.'
      operationId: texts
      parameters:
      - in: path
        name: lang
        required: true
        schema:
          type: string
      - in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: Wordings of all text references in one language
      tags:
      - Texts
  /orchestrator/api/v1/tools/catalog:
    get:
      description: No auth, no channel required - purely descriptive.
      operationId: catalog
      responses:
        '200':
          content:
            application/json:
              example:
              - hint:
                  key: persoenliche-daten-und-freischaltcode-8a654d
                method: fsc
                name:
                  key: freischaltcode-1b35c2
                role: IDENTIFICATION
                toolId: ident-fsc
                versions:
                - 1
              - hint:
                  key: code-an-eine-telefonnummer-a62b47
                method: sms
                name:
                  key: sms-40b601
                role: ENROLLMENT
                toolId: enroll-sms
                versions:
                - 1
              - hint:
                  key: code-an-die-hinterlegte-telefonnummer-76a2d3
                method: sms
                name:
                  key: sms-40b601
                role: KNOWN_ACCOUNT_AUTH
                toolId: auth-sms
                versions:
                - 1
              schema:
                items:
                  $ref: '#/components/schemas/ToolCatalogEntry'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      summary: List every registered tool
      tags:
      - Tool catalog
  /tools/api/{toolId}/v{version}/{toolSessionId}:
    delete:
      description: Moves the journey on according to the state it is standing on - to the next fallback option, back to the
        selection step, or to the end of the journey if nothing else could be offered.
      operationId: abandon
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: toolId
        required: true
        schema:
          type: string
      - in: path
        name: version
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currentAcr: loa1
                  state: STEP_UP_IN_PROGRESS
                next:
                  context: auth
                  step: selectMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - auth-password
                  - auth-device
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: auth-sms abandoned during a fallback chain - offers the other loa2 candidates.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Abandon this tool attempt
      tags:
      - Tools
  /tools/api/{toolId}/v{version}/{toolSessionId}/back:
    post:
      description: 'Ends this tool attempt without declining it: the journey shows its selection page again, with every method
        still on offer - this one included, and even when it is the only one. Where the journey has no selection page (a single
        preferred method), this is the same as abandoning.'
      operationId: back
      parameters:
      - in: path
        name: toolSessionId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: toolId
        required: true
        schema:
          type: string
      - in: path
        name: version
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                channel:
                  channelSessionId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: ANONYMOUS
                next:
                  context: registration
                  step: selectIdentificationMethod
                  type: orchestrator
                stepData:
                  kind: select-method
                  options:
                  - ident-fsc
                  - ident-eid
                  - ident-nect
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          description: Back from ident-fsc during registration - both identification methods are offered again.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error. `error` names the case; its HTTP status is fixed per code (see ErrorResponse).
      security:
      - dpop: [
          ]
      summary: Go back from this tool to the selection
      tags:
      - Tools
tags:
- description: Facade-neutral channel resource - shared by every facade that creates one
  name: Channels
- description: Wordings for the text references in every response, per language, with ETag
  name: Texts
- description: 'Leaving an activated tool: back to the selection, or declining it'
  name: Tools
- description: The full set of registered tools, independent of any journey
  name: Tool catalog
- description: The App facade's own endpoints - channel creation and the device-link read
  name: App channels
